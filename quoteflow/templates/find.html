{% extends "base.html" %}
{% block content %}
{% set tab='customer' %}{% include '_acct_tabs.html' %}
<form method="post" class="card">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <h1 style="margin-top:0">Find your service provider</h1>
  <p class="muted" style="margin-top:-6px">Type the short name or paste the link the business gave you (it looks like .../c/<b>name</b>).</p>
  <input name="q" required maxlength="200" placeholder="e.g. gulf-cooling" autocapitalize="none" spellcheck="false">
  <div class="btnrow"><button class="btn" type="submit" style="flex:1">Continue</button></div>
</form>
{% endblock %}
