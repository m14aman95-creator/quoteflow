{% extends "base.html" %}
{% block content %}
<h1>Preview · {{ q.number }}</h1>
<div class="card">
  <div class="btnrow" style="margin-top:0">
    {% for v, l in [('en','English'),('ar','العربية'),('both','English + العربية')] %}
    <a class="btn small {{ '' if lang==v else 'secondary' }}" href="{{ url_for('quotes.preview', qid=q.id, lang=v) }}">{{ l }}</a>{% endfor %}
  </div>
  <div class="btnrow">
    <a class="btn" href="{{ url_for('quotes.pdf', qid=q.id, lang=lang) }}">Download PDF</a>
    <a class="btn secondary" href="{{ url_for('quotes.share', qid=q.id, lang=lang) }}">Share on WhatsApp</a>
    <button class="btn secondary" type="button" onclick="document.getElementById('docframe').contentWindow.print()">Print</button>
    <a class="btn secondary" href="{{ url_for('quotes.view', qid=q.id) }}">Back to quote</a>
  </div>
</div>
<iframe id="docframe" title="Quotation preview" src="{{ url_for('quotes.document', qid=q.id, lang=lang) }}"
  style="width:100%;height:1150px;border:1px solid var(--line);border-radius:12px;background:#fff"></iframe>
{% endblock %}
