# Render Blueprint: New > Blueprint > pick this repo. Free plan: the disk resets when the service sleeps.
services:
  - type: web
    name: quoteflow-ai
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: QF_AI_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
